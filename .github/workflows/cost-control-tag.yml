name: cost-control-tag

on:
  schedule:
    # Avoid the busiest minute; schedules are best-effort, not an availability SLA.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      temporaryRecovery:
        description: Explicit authorized temporary tag repair and stopped-server recovery; does not renew an exemption
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/cost-control-tag.yml'
      - 'scripts/ensure-postgres-available.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: learning-portal-postgres-guard
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: hammadlearningapp

jobs:
  check-postgres-cost-control:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check PostgreSQL availability and CostControl tag
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          POSTGRES_GUARD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.temporaryRecovery && 'recover' || 'check' }}
          SERVER_READY_MAX_ATTEMPTS: '40'
          SERVER_READY_RETRY_DELAY: '30'
        run: bash scripts/ensure-postgres-available.sh
