name: cd

on:
  workflow_dispatch:
    inputs:
      deployInfra:
        description: Force infrastructure deployment before app deployment
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: learning-portal-production
  cancel-in-progress: false

env:
  AZURE_CUSTOM_HOSTNAME: skilling.hammadaslam.com
  AZURE_APPINSIGHTS_NAME: appi-personal-learning-tn33sb
  AZURE_LOCATION: eastus2
  AZURE_POSTGRES_LOCATION: centralus
  AZURE_LOG_ANALYTICS_NAME: log-personal-learning-tn33sb
  AZURE_RESOURCE_GROUP: hammadlearningapp
  AZURE_APP_SERVICE_PLAN_NAME: plan-personal-learning-tn33sb
  AZURE_APP_SERVICE_PLAN_SKU: P0v3
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZD_ENVIRONMENT_NAME: personal-learning
  PROJECT_PATH: ./src/UpskillTracker/UpskillTracker.csproj
  PUBLISH_PATH: ./publish
  PACKAGE_PATH: ./upskilltracker.zip
  COPILOT_DEFAULT_MODEL: gpt-5
  POSTGRES_ADMIN_LOGIN: pgbootstrap

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the current main commit
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main commit exists. Deploy that commit instead of overwriting it."
            exit 1
          fi

      - name: Detect infrastructure changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'azure.yaml'
              - '.github/workflows/cd.yml'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --runtime linux-x64 --self-contained false --output ${{ env.PUBLISH_PATH }} -p:SourceRevisionId="$GITHUB_SHA"

      - name: Package deployment artifacts
        run: |
          cd ${{ env.PUBLISH_PATH }}
          zip -qr ${{ github.workspace }}/upskilltracker.zip .

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Preserve the custom domain certificate
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          thumbprint=$(az webapp show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --query "hostNameSslStates[?name=='$AZURE_CUSTOM_HOSTNAME'].thumbprint | [0]" \
            --only-show-errors -o tsv)
          managed_certificate_id=$(az resource list \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.Web/certificates \
            --query "[?name=='$AZURE_CUSTOM_HOSTNAME'].id | [0]" --only-show-errors -o tsv)
          if [ -z "$thumbprint" ] && [ -n "$managed_certificate_id" ]; then
            thumbprint=$(az webapp config ssl show \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" --certificate-name "$AZURE_CUSTOM_HOSTNAME" \
              --query thumbprint --only-show-errors -o tsv)
          fi
          echo "EXISTING_TLS_THUMBPRINT=$thumbprint" >> "$GITHUB_ENV"
          echo "MANAGED_TLS_CERTIFICATE_ID=$managed_certificate_id" >> "$GITHUB_ENV"

      - name: Deploy infrastructure
        id: infra
        if: inputs.deployInfra || steps.changes.outputs.infra == 'true'
        env:
          APP_ACCESS_PIN: ${{ secrets.APP_ACCESS_PIN }}
          APP_GH_OAUTH_CLIENT_ID: ${{ secrets.APP_GH_OAUTH_CLIENT_ID }}
          APP_GH_OAUTH_CLIENT_SECRET: ${{ secrets.APP_GH_OAUTH_CLIENT_SECRET }}
          APP_YOUTUBE_API_KEY: ${{ secrets.APP_YOUTUBE_API_KEY }}
          APP_POSTGRES_ADMIN_PASSWORD: ${{ secrets.APP_POSTGRES_ADMIN_PASSWORD }}
        run: |
          deployment_output=$(az deployment group create \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name infra-${{ github.run_id }} \
            --template-file infra/resources.bicep \
            --parameters accessPin="$APP_ACCESS_PIN" \
                         gitHubOAuthClientId="$APP_GH_OAUTH_CLIENT_ID" \
                         gitHubOAuthClientSecret="$APP_GH_OAUTH_CLIENT_SECRET" \
                         youTubeApiKey="$APP_YOUTUBE_API_KEY" \
                         postgresAdminLogin=${{ env.POSTGRES_ADMIN_LOGIN }} \
                         postgresAdminPassword="$APP_POSTGRES_ADMIN_PASSWORD" \
                         copilotDefaultModel=${{ env.COPILOT_DEFAULT_MODEL }} \
            --parameters location=${{ env.AZURE_LOCATION }} \
                         postgresLocation=${{ env.AZURE_POSTGRES_LOCATION }} \
                         appInsightsName=${{ env.AZURE_APPINSIGHTS_NAME }} \
                         appServicePlanName=${{ env.AZURE_APP_SERVICE_PLAN_NAME }} \
                         appServicePlanSku=${{ env.AZURE_APP_SERVICE_PLAN_SKU }} \
                         webAppName=${{ env.AZURE_WEBAPP_NAME }} \
                         customHostname=${{ env.AZURE_CUSTOM_HOSTNAME }} \
                         customHostnameCertificateThumbprint="$EXISTING_TLS_THUMBPRINT" \
                         logAnalyticsWorkspaceName=${{ env.AZURE_LOG_ANALYTICS_NAME }})

          echo "$deployment_output" > deployment-output.json
          postgres_server_name=$(jq -r '.properties.outputs.postgresServerName.value' deployment-output.json)
          postgres_database_name=$(jq -r '.properties.outputs.postgresDatabaseName.value' deployment-output.json)

          echo "POSTGRES_SERVER_NAME=$postgres_server_name" >> $GITHUB_ENV
          echo "POSTGRES_DATABASE_NAME=$postgres_database_name" >> $GITHUB_ENV

      - name: Configure PostgreSQL Entra admin
        if: steps.infra.outcome == 'success'
        run: |
          webapp_principal_id=$(az webapp identity show \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --query principalId -o tsv)
          webapp_principal_name="${{ env.AZURE_WEBAPP_NAME }}"

          existing_admin_object_id=$(az postgres flexible-server microsoft-entra-admin list \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server-name ${{ env.POSTGRES_SERVER_NAME }} \
            --query "[0].objectId" -o tsv)

          if [ -n "$existing_admin_object_id" ] && [ "$existing_admin_object_id" != "$webapp_principal_id" ]; then
            az postgres flexible-server microsoft-entra-admin delete \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --server-name ${{ env.POSTGRES_SERVER_NAME }} \
              --object-id "$existing_admin_object_id" \
              --yes
          fi

          if [ "$existing_admin_object_id" != "$webapp_principal_id" ]; then
            az postgres flexible-server microsoft-entra-admin create \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --server-name ${{ env.POSTGRES_SERVER_NAME }} \
              --display-name "$webapp_principal_name" \
              --object-id "$webapp_principal_id" \
              --type ServicePrincipal
          else
            echo "PostgreSQL Microsoft Entra admin already matches the web app identity."
          fi

          az postgres flexible-server microsoft-entra-admin show \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server-name ${{ env.POSTGRES_SERVER_NAME }} \
            --object-id "$webapp_principal_id"

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src-path ${{ env.PACKAGE_PATH }} \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --track-status true \
            --timeout 180000

      - name: Verify the deployed commit and database readiness
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/healthz"
          for attempt in $(seq 1 30); do
            diagnostic="request failed"
            if status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                --output "$body" --write-out '%{http_code}' "$url"); then
              if [ "$status" = "200" ] && jq -e --arg sha "$GITHUB_SHA" \
                  '.status == "healthy" and .commit == $sha' "$body" >/dev/null; then
                echo "The deployed commit is serving with a ready database."
                echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
                echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- App: https://${AZURE_WEBAPP_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if jq -e 'type == "object"' "$body" >/dev/null 2>&1; then
                health=$(jq -c '{
                  status: (if (.status | type) == "string" then .status[:32] else null end),
                  version: (if (.version | type) == "string" then .version[:120] else null end),
                  commit: (if (.commit | type) == "string" then .commit[:64] else null end)
                }' "$body")
                actual_commit=$(jq -r 'if (.commit | type) == "string" then .commit else "missing" end' "$body")
                if [[ "$status" = 3?? ]]; then
                  diagnostic="redirect response (HTTP $status); health=$health"
                elif [ "$status" != "200" ]; then
                  diagnostic="HTTP $status; health=$health"
                elif [ "$actual_commit" != "$GITHUB_SHA" ]; then
                  diagnostic="stale commit (expected $GITHUB_SHA, actual $actual_commit); health=$health"
                else
                  diagnostic="unhealthy response; health=$health"
                fi
              elif [[ "$status" = 3?? ]]; then
                diagnostic="redirect response (HTTP $status, non-JSON body not displayed)"
              else
                diagnostic="HTTP $status with non-JSON body (not displayed)"
              fi
            else
              curl_exit=$?
              diagnostic="request failed (curl exit $curl_exit)"
            fi
            echo "Waiting for the new app and database (attempt $attempt/30): $diagnostic."
            sleep 20
          done
          echo "::error::The expected commit did not become healthy. Deployment is not confirmed."
          exit 1

      - name: Enable and verify custom-domain HTTPS
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          thumbprint="$EXISTING_TLS_THUMBPRINT"
          if [ -z "$thumbprint" ]; then
            if [ -z "$MANAGED_TLS_CERTIFICATE_ID" ]; then
              az webapp config ssl create \
                --subscription "$AZURE_SUBSCRIPTION_ID" \
                --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
                --hostname "$AZURE_CUSTOM_HOSTNAME" --certificate-name "$AZURE_CUSTOM_HOSTNAME" \
                --only-show-errors --output none
            fi
            for attempt in $(seq 1 30); do
              thumbprint=$(az webapp config ssl show \
                --subscription "$AZURE_SUBSCRIPTION_ID" \
                --resource-group "$AZURE_RESOURCE_GROUP" --certificate-name "$AZURE_CUSTOM_HOSTNAME" \
                --query thumbprint --only-show-errors -o tsv)
              if [ -n "$thumbprint" ] && [ "$thumbprint" != "None" ]; then
                break
              fi
              echo "Waiting for Azure to finish certificate issuance (attempt $attempt/30)."
              sleep 20
            done
          fi
          if [ -z "$thumbprint" ] || [ "$thumbprint" = "None" ]; then
            echo "::error::Azure did not issue a managed certificate for the custom hostname."
            exit 1
          fi
          binding=$(jq -n --arg app "$AZURE_WEBAPP_NAME" --arg thumbprint "$thumbprint" \
            '{properties: {azureResourceName: $app, azureResourceType: "Website",
              customHostNameDnsRecordType: "CName", hostNameType: "Verified",
              siteName: $app, sslState: "SniEnabled", thumbprint: $thumbprint}}')
          az rest --method put \
            --url "https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_WEBAPP_NAME}/hostNameBindings/${AZURE_CUSTOM_HOSTNAME}?api-version=2024-11-01" \
            --body "$binding" --only-show-errors --output none
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for attempt in $(seq 1 18); do
            diagnostic="request failed"
            if status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                --output "$body" --write-out '%{http_code}' "https://${AZURE_CUSTOM_HOSTNAME}/healthz"); then
              if [ "$status" = "200" ] && jq -e --arg sha "$GITHUB_SHA" \
                  '.status == "healthy" and .commit == $sha' "$body" >/dev/null; then
                echo "- Custom domain: https://${AZURE_CUSTOM_HOSTNAME}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if jq -e 'type == "object"' "$body" >/dev/null 2>&1; then
                health=$(jq -c '{
                  status: (if (.status | type) == "string" then .status[:32] else null end),
                  version: (if (.version | type) == "string" then .version[:120] else null end),
                  commit: (if (.commit | type) == "string" then .commit[:64] else null end)
                }' "$body")
                actual_commit=$(jq -r 'if (.commit | type) == "string" then .commit else "missing" end' "$body")
                if [[ "$status" = 3?? ]]; then
                  diagnostic="redirect response (HTTP $status); health=$health"
                elif [ "$status" != "200" ]; then
                  diagnostic="HTTP $status; health=$health"
                elif [ "$actual_commit" != "$GITHUB_SHA" ]; then
                  diagnostic="stale commit (expected $GITHUB_SHA, actual $actual_commit); health=$health"
                else
                  diagnostic="unhealthy response; health=$health"
                fi
              elif [[ "$status" = 3?? ]]; then
                diagnostic="redirect response (HTTP $status, non-JSON body not displayed)"
              else
                diagnostic="HTTP $status with non-JSON body (not displayed)"
              fi
            else
              curl_exit=$?
              diagnostic="request failed (curl exit $curl_exit)"
            fi
            echo "Waiting for custom-domain HTTPS (attempt $attempt/18): $diagnostic."
            sleep 10
          done
          echo "::error::Custom-domain HTTPS did not become healthy."
          exit 1
