name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/**

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate infrastructure
        run: az bicep build --file ./infra/main.bicep --stdout > /dev/null

      - name: Restore
        run: dotnet restore ./tests/UpskillTracker.Tests/UpskillTracker.Tests.csproj

      - name: Build
        run: dotnet build ./tests/UpskillTracker.Tests/UpskillTracker.Tests.csproj --configuration Release --no-restore

      - name: Run regression tests
        env:
          POSTGRES_TEST_CONNECTION_STRING: "Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=postgres;Username=postgres;Password=local-ci-only;SSL Mode=Disable"
        run: dotnet test ./tests/UpskillTracker.Tests/UpskillTracker.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=regression.trx" --results-directory ./test-results

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Exercise learner journeys
        working-directory: tests/browser
        run: npm test

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            tests/browser/test-results/
          retention-days: 7
